[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amo-crm-sales-assistant"
version = "0.3.0"
description = "BM25 assistant for amoCRM conversations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "snowballstemmer>=2.2,<4",
]

[project.scripts]
amo-assistant = "sales_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sales_assistant = ["web/*.html"]
